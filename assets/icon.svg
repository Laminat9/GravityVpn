<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2025" />
      <stop offset="100%" stop-color="#141518" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A50" />
      <stop offset="100%" stop-color="#E4743F" />
    </linearGradient>
    <linearGradient id="accentGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA875" />
      <stop offset="100%" stop-color="#E4743F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Subtle glow backdrop -->
  <ellipse cx="128" cy="130" rx="60" ry="60" fill="#E4743F" opacity="0.18" filter="url(#glow)"/>

  <!-- Shield Outline -->
  <path d="M 128 38 
           C 168 54, 196 60, 204 74 
           C 206 132, 178 184, 128 218 
           C 78 184, 50 132, 52 74 
           C 60 60, 88 54, 128 38 Z" 
        fill="#1A1C20" 
        stroke="url(#accentGrad)" 
        stroke-width="7" 
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Inner subtle shield contour -->
  <path d="M 128 54 
           C 160 67, 182 72, 188 84 
           C 190 130, 166 172, 128 200 
           C 90 172, 66 130, 68 84 
           C 74 72, 96 67, 128 54 Z" 
        fill="none" 
        stroke="rgba(228, 116, 63, 0.25)" 
        stroke-width="2" 
        stroke-linejoin="round"/>

  <!-- Top Wavy Gravity Line -->
  <path d="M 88 116 
           C 104 98, 120 98, 136 116 
           C 152 134, 168 134, 184 116" 
        fill="none" 
        stroke="url(#accentGradLight)" 
        stroke-width="6.5" 
        stroke-linecap="round"/>

  <!-- Bottom Wavy Gravity Line -->
  <path d="M 72 146 
           C 92 124, 112 124, 132 146 
           C 152 168, 172 168, 192 146" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round"/>
        
  <!-- Center Core Gravity Dot -->
  <circle cx="128" cy="131" r="4" fill="#FFB085" />
</svg>
